name: Inspect original APK

on:
  push:
    branches: [zeus-txt-export]
    paths:
      - 'original/**'
      - '.github/workflows/inspect-original-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install APK analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip aapt
          curl -fL https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar

      - name: Inspect without changing the APK
        shell: bash
        run: |
          set -euo pipefail
          APK="original/ASHRAF BASHA_1.4.apk"
          test -s "$APK"
          mkdir -p inspection
          sha256sum "$APK" > inspection/sha256.txt
          aapt dump badging "$APK" > inspection/aapt-badging.txt 2>&1 || true
          ./jadx/bin/jadx --show-bad-code -d decompiled "$APK" > inspection/jadx.log 2>&1 || true
          java -jar apktool.jar d --no-res -f "$APK" -o decoded > inspection/apktool.log 2>&1 || true
          if [ -f decoded/AndroidManifest.xml ]; then
            cp decoded/AndroidManifest.xml inspection/AndroidManifest.xml
          fi
          if [ -d decompiled/sources ]; then
            grep -RniE 'contact|bluetooth|shared|save|export|pbap' decompiled/sources > inspection/relevant-code-index.txt || true
            find decompiled/sources -type f -name '*.java' -print > inspection/java-files.txt
          fi
          {
            echo "APK: $APK"
            echo
            echo "AAPT package/activity summary:"
            grep -E '^(package:|launchable-activity:|application:)' inspection/aapt-badging.txt || true
            echo
            echo "JADX output:"
            find decompiled -maxdepth 2 -type f | head -100 || true
            echo
            echo "Decoded resource layouts:"
            find decoded/res/layout -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort || true
            echo
            echo "Tool logs are included in this artifact."
          } > inspection/summary.txt

      - name: Upload inspection bundle
        uses: actions/upload-artifact@v4
        with:
          name: original-apk-inspection
          path: |
            inspection/
            decompiled/sources/
            decompiled/resources/
            decoded/res/layout/
            decoded/res/values/
          if-no-files-found: error
          retention-days: 7
