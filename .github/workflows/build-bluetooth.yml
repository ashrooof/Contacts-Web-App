name: Build Bluetooth TXT Collector
on:
  push:
    branches: [ "bluetooth-txt-collector", "bluetooth-txt-collector-dev" ]
  pull_request:
    branches: [ "bluetooth-txt-collector" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: gradle assembleDebug
      - name: Telegram sendDocument smoke test
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN is not configured; Telegram delivery test was skipped."
            exit 0
          fi
          CHAT_ID="${TELEGRAM_CHAT_ID:-8552540563}"
          printf 'Bluetooth Collector Telegram integration test\\nBuild: %s\\nCommit: %s\\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > telegram-smoke-test.txt
          RESPONSE=$(curl --silent --show-error --fail-with-body "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=$CHAT_ID" \
            -F "document=@telegram-smoke-test.txt;type=text/plain")
          echo "$RESPONSE" | grep -q '"ok":true'
          echo "Telegram sendDocument smoke test passed."
      - uses: actions/upload-artifact@v4
        with:
          name: bluetooth-txt-collector-debug
          path: app/build/outputs/apk/debug/app-debug.apk
