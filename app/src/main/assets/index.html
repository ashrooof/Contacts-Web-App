<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contacts Web App</title>
<style>
:root{color-scheme:light;--ink:#17202b;--muted:#718096;--line:#e7ebf0;--accent:#315caa;--bg:#f4f6f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:28px 18px}
header{padding:24px 0}h1{font-size:27px;margin:0 0 8px}p{color:var(--muted);line-height:1.7;margin:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 30px #1b2a3a0a}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
button{border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;background:var(--accent);color:#fff}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;margin:14px 0}
.stats{display:flex;gap:10px;margin:14px 0}.stat{background:#f6f8fb;padding:12px 16px;border-radius:12px;flex:1}
.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.item{padding:14px 2px;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.name{font-weight:700}.phone{direction:ltr;text-align:right;color:var(--muted);font-size:14px;margin-top:5px}
#status{font-size:14px;margin-top:12px}.notice{font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main>
<header><h1>جهات الاتصال</h1><p>اعرض جهات الاتصال على جهازك بعد منح الإذن.</p></header>
<section class="panel">
<div class="actions"><button onclick="requestContacts()">السماح وعرض جهات الاتصال</button></div>
<div id="status">لم يتم طلب الإذن بعد.</div>
<div class="stats"><div class="stat"><strong id="count">0</strong><span>جهة اتصال</span></div></div>
<input id="search" placeholder="ابحث بالاسم أو الرقم..." oninput="render()">
<div id="list"></div>
<p class="notice">تتم قراءة البيانات محليًا داخل التطبيق فقط، ولا يتم رفعها أو إرسالها إلى أي خادم.</p>
</section>
</main>
<script>
let contacts=[];
function requestContacts(){
 if(window.AndroidContacts){document.getElementById('status').textContent='في انتظار إذن Android...';AndroidContacts.requestContacts();}
 else{document.getElementById('status').textContent='هذه الصفحة تعمل داخل تطبيق Android فقط. افتح ملف APK لقراءة جهات الاتصال.';}
}
window.onContactsReceived=function(raw){
 try{contacts=JSON.parse(raw)||[];document.getElementById('status').textContent='تم تحميل جهات الاتصال على الجهاز.';render();}
 catch(e){document.getElementById('status').textContent='تعذر قراءة البيانات.';}
};
window.onContactsPermissionDenied=function(){document.getElementById('status').textContent='لم يتم منح إذن جهات الاتصال.';};
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const filtered=contacts.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').toLowerCase().includes(q));
 document.getElementById('count').textContent=contacts.length;
 document.getElementById('list').innerHTML=filtered.map(c=>'<div class="item"><div class="name">'+escapeHtml(c.name||'بدون اسم')+'</div><div class="phone">'+escapeHtml(c.phone||'')+'</div></div>').join('')||'<p>لا توجد نتائج.</p>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
